[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-scraper"
version = "0.1.0"
description = "A configuration-driven, responsible web-scraping toolkit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Web Scraper contributors" }]
dependencies = [
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.0",
  "lxml>=5.2.0",
  "openpyxl>=3.1.2",
  "pandas>=2.2.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
playwright = ["playwright>=1.44.0"]
scrapy = ["scrapy>=2.11.0"]
selenium = ["selenium>=4.21.0"]
dev = [
  "mypy>=1.10.0",
  "pandas-stubs>=2.2.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "types-openpyxl>=3.1.5.20250710",
  "types-PyYAML>=6.0.12.20240311",
]

[project.scripts]
web-scraper = "web_scraper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["web_scraper"]
exclude = ["tests"]
